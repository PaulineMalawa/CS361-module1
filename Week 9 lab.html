<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week 9 Lab</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 2rem;
        line-height: 1.6;
        background: #f7f7f7;
        color: #222;
      }

      main {
        max-width: 700px;
        margin: 0 auto;
        background: white;
        padding: 2rem;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      button,
      input {
        padding: 0.5rem;
        margin: 0.25rem 0;
      }

      .dark {
        background: #111;
        color: #f5f5f5;
      }

      .dark main {
        background: #222;
        color: #f5f5f5;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      #formMessage {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Interactive Page</h1>

      <section>
        <h2>Click Counter</h2>
        <button id="counterButton">Click me</button>
        <p>Count: <span id="counterValue">0</span></p>
      </section>

      <section>
        <h2>Theme Toggle</h2>
        <button id="themeButton">Dark Mode</button>
      </section>

      <section>
        <h2>Course List</h2>
        <input id="courseNameInput" type="text" placeholder="Enter a new course" />
        <input id="searchInput" type="text" placeholder="Search courses" />
        <button id="addCourseButton">Add Course</button>
        <ul id="courseList"></ul>
      </section>

      <section>
        <h2>Sign Up</h2>
        <form id="signupForm">
          <label>
            Name:
            <input id="nameInput" name="name" type="text" />
          </label>
          <label>
            Email:
            <input id="emailInput" name="email" type="email" />
          </label>
          <button type="submit">Sign Up</button>
          <p id="formMessage"></p>
        </form>
      </section>
    </main>

    <script src="Week 9 lab.js"></script>
  </body>
</html>
